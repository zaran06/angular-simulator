<p-table
  [value]="posts"
  [contextMenu]="cm"
  [(contextMenuSelection)]="selectedPost"
  [paginator]="true"
  [rows]="rows"
  [totalRecords]="total"
  [rowsPerPageOptions]="[10, 20, 50]"
  [lazy]="true"
  [first]="first"
  (onLazyLoad)="onTableLazyLoad($event)"
>
  <ng-template pTemplate="header">
    <tr>
      <th>Title</th>
      <th>Tags</th>
      <th>Views</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-post>
    <tr [pContextMenuRow]="post">
      @if (loading) {
        <td>
          <p-skeleton width="100%" height="24px"></p-skeleton>
        </td>

        <td>
          <p-skeleton width="70%" height="24px"></p-skeleton>
        </td>

        <td>
          <p-skeleton width="40%" height="24px"></p-skeleton>
        </td>
      } @else {
        <td>{{ post.title }}</td>
        <td>{{ post.tags }}</td>
        <td>{{ post.views }}</td>
      }
    </tr>
  </ng-template>
</p-table>

<p-contextMenu #cm [model]="menuItems"></p-contextMenu>
